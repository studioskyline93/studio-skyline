<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Detail — Studio Skyline</title>
  <link rel="stylesheet" href="style.css">
  <style>.media-img{width:100%;height:100%;object-fit:cover;display:block}
  #modalImg{max-width:100%;max-height:62vh;margin:0 auto;display:none;object-fit:contain}
    #modalVideo{max-height:62vh}
    #modalAngles{display:none;gap:10px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid rgba(255,255,255,.12)}
    .angle-sq{width:72px;height:72px;border-radius:10px;overflow:hidden;padding:0;cursor:pointer;background:#111;
      border:2px solid rgba(255,255,255,.25);opacity:.7;transition:opacity .15s,border-color .15s}
    .angle-sq:hover{opacity:1}
    .angle-sq.on{border-color:#fff;opacity:1}
    .angle-sq img,.angle-sq video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .triple-center-inner,.triple-ghost-inner{aspect-ratio:16/9;overflow:hidden}
    .triple-center-inner video,.triple-center-inner img,.triple-ghost-inner video,.triple-ghost-inner img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
    @keyframes ssFade{from{opacity:0}to{opacity:1}}
    .triple-center-inner,.triple-ghost-inner{animation:ssFade .7s ease}
    @media (prefers-reduced-motion:reduce){.triple-center-inner,.triple-ghost-inner{animation:none}}
    .folder-chip{position:absolute;top:10px;left:10px;z-index:2;display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
      background:rgba(255,255,255,.9);color:#18181b;font-size:12px;letter-spacing:.02em;backdrop-filter:blur(6px)}
    .folder-mosaic{display:grid;width:100%;height:100%;gap:3px;grid-template-columns:1fr 1fr;grid-template-rows:1fr}
    .folder-mosaic.three{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
    .folder-mosaic.three .fm-cell:first-child{grid-row:1 / span 2}
    .fm-cell{min-height:0;min-width:0;overflow:hidden}
    .fm-cell video,.fm-cell img{width:100%;height:100%;object-fit:cover;display:block}
    #folderBar{display:none;align-items:center;gap:18px;margin:36px 0 4px}
    #folderBar.on{display:flex}
    .folder-back{background:none;border:none;cursor:pointer;font:inherit;font-size:14px;text-decoration:underline;padding:0;color:inherit}
    .folder-title{font-size:20px;font-weight:600;letter-spacing:-.01em}
    .swap{animation:ssFade .45s ease}
    .modal-box{max-height:94vh;overflow-y:auto}
    .modal-client{margin-top:4px;font-size:13px;opacity:.65;letter-spacing:.04em}
    .modal-details{margin-top:10px;font-size:14px;line-height:1.65;opacity:.85;max-width:70ch}
    .vid-card-body .client,.triple-caption .client{font-size:12px;opacity:.6;margin-top:2px}
    .vid-card-media{aspect-ratio:16/9;overflow:hidden;position:relative}
    .vid-card-media img,.vid-card-media video{width:100%;height:100%;object-fit:cover;display:block}
  </style>
</head>
<body>
  <div id="site-header"></div>

  <div class="site-main">
    <div class="detail-header" id="detailHeader"></div>
    <div id="tripleView"></div>
    <div id="detailDesc"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="videoModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="counter" id="modalCounter"></div>
        <div class="modal-controls">
          <button class="modal-btn" onclick="modalNav(-1)" aria-label="Previous">&#8249;</button>
          <button class="modal-btn" onclick="modalNav(1)" aria-label="Next">&#8250;</button>
          <button class="modal-close" onclick="closeModal()">Close</button>
        </div>
      </div>
      <video id="modalVideo" controls playsinline preload="auto" class="modal-video"></video>
      <img id="modalImg" alt="">
      <div id="modalAngles"></div>
      <div class="modal-caption" id="modalCaption"></div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="shared.js"></script>
  <script src="data.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var slug = params.get("slug");

    function isVideoSrc(src) {
      return /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(src || "");
    }
    function modalSources(item) {
      var list = [item.src];
      (item.angles || []).forEach(function(a) { list.push((typeof a === "string") ? a : a.src); });
      return list;
    }
    function mediaTag(src, preload, noLoop) {
      if (isVideoSrc(src)) {
        return '<video src="' + src + '" autoplay ' + (noLoop ? '' : 'loop ') + 'muted playsinline preload="' + preload + '"></video>';
      }
      return '<img class="media-img" src="' + src + '" alt="" loading="lazy">';
    }

    function findCollection(collections) {
      for (var i = 0; i < collections.length; i++) {
        if (collections[i].slug === slug) return collections[i];
      }
      return null;
    }

    (async function() {
    var workData = await loadWorkContent();
    var allCollections = (workData && workData.collections) ? workData.collections : WORK_COLLECTIONS;
    var collection = findCollection(allCollections);

    if (!collection) {
      document.getElementById("detailHeader").innerHTML = '<h1 class="detail-title">Collection not found</h1>';
      return;
    }
    {
      document.title = collection.title + " — Studio Skyline";

      // Header
      var headerHtml = '';
      headerHtml += '<h1 class="detail-title">' + esc(collection.title) + '</h1>';
      if (collection.subtitle) headerHtml += '<p class="detail-sub">' + esc(collection.subtitle) + '</p>';
      document.getElementById("detailHeader").innerHTML = headerHtml;

      // Description
      if (collection.description) {
        document.getElementById("detailDesc").innerHTML = '<p class="detail-desc">' + esc(collection.description) + '</p>';
      }

      var videos = collection.videos;
      var active = 0;
      var modalIndex = -1;
      var angleIdx = 0;

      function pad(n) { return String(n).padStart(2, "0"); }

      function clamp(i) {
        if (videos.length === 0) return 0;
        return ((i % videos.length) + videos.length) % videos.length;
      }

      // ---- Auto-advance ----
      var hovering = false, autoTimer = null;
      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function autoPaused() { return hovering || modalIndex >= 0 || document.hidden; }
      function clearAuto() { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } }

      function bindAuto() {
        clearAuto();
        if (videos.length < 2 || reduceMotion) return;
        var cv = document.querySelector("#tripleStage .triple-center-inner video");
        if (cv) {
          // Videos play through once, then move on
          cv.onended = function() {
            if (autoPaused()) { cv.currentTime = 0; cv.play(); } else { setActive(active + 1); }
          };
          autoTimer = setTimeout(function() {
            if (autoPaused()) bindAuto(); else setActive(active + 1);
          }, 20000);
        } else {
          // Photos stay for 5 seconds
          autoTimer = setTimeout(function tick() {
            if (autoPaused()) { autoTimer = setTimeout(tick, 1000); } else { setActive(active + 1); }
          }, 5000);
        }
      }

      document.addEventListener("visibilitychange", function() { if (!document.hidden) bindAuto(); });

      // ---- Rendering ----
      function renderStage() {
        var len = videos.length;
        var prevI = clamp(active - 1);
        var nextI = clamp(active + 1);
        var current = videos[active];

        var html = '<div class="triple-view">';

        if (len > 1) {
          html += '<button class="triple-ghost left" onclick="setActive(' + prevI + ')" aria-label="Previous">' +
            '<div class="triple-ghost-inner" style="position:relative">' +
            mediaTag(videos[prevI].src, 'metadata') +
            '<div class="fade-left"></div></div></button>';
          html += '<button class="triple-ghost right" onclick="setActive(' + nextI + ')" aria-label="Next">' +
            '<div class="triple-ghost-inner" style="position:relative">' +
            mediaTag(videos[nextI].src, 'metadata') +
            '<div class="fade-right"></div></div></button>';
        }

        html += '<div class="triple-center"><div class="triple-center-inner">' +
          mediaTag(current.src, 'auto', len > 1) +
          '</div></div>';

        if (len > 1) {
          html += '<div class="triple-nav">' +
            '<button class="nav-circle" onclick="setActive(' + prevI + ')" aria-label="Previous">&#8249;</button>' +
            '<button class="nav-circle" onclick="setActive(' + nextI + ')" aria-label="Next">&#8250;</button>' +
            '</div>';
        }
        html += '</div>';

        document.getElementById("tripleStage").innerHTML = html;
      }

      // ---- Grid: single cards + client folders ----
      var gridScope = null;      // null = top level, otherwise a client key (inside a folder)
      var folderKeys = [];       // folder index -> client key (rebuilt on each top-level render)
      var folderNames = {};      // client key -> display name

      function clientKey(v) { return (v.client || "").trim().toLowerCase(); }

      function itemCard(v, i) {
        return '<button class="vid-card" data-i="' + i + '" onclick="openModal(' + i + ')">' +
          '<div class="vid-card-media">' + mediaTag(v.src, 'metadata') + '<div class="overlay"></div></div>' +
          '<div class="vid-card-body">' +
          '<div class="title">' + esc(v.title || '') + '</div>' +
          (v.client ? '<div class="client">' + esc(v.client) + '</div>' : '') +
          '<div class="bar"></div></div></button>';
      }

      function folderCard(key, idxs, n) {
        var shown = idxs.slice(0, 3);
        var cells = '';
        shown.forEach(function(i) { cells += '<div class="fm-cell">' + mediaTag(videos[i].src, 'metadata') + '</div>'; });
        var icon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
        return '<button class="vid-card folder-card" onclick="openFolder(' + n + ')">' +
          '<div class="vid-card-media"><div class="folder-chip">' + icon + '<span>Folder</span></div>' +
          '<div class="folder-mosaic' + (shown.length >= 3 ? ' three' : '') + '">' + cells + '</div>' +
          '<div class="overlay"></div></div>' +
          '<div class="vid-card-body"><div class="title">' + esc(folderNames[key]) + '</div>' +
          '<div class="bar"></div></div></button>';
      }

      function scopeList() {
        var out = [];
        videos.forEach(function(v, i) { if (gridScope === null || clientKey(v) === gridScope) out.push(i); });
        return out;
      }

      function renderGrid() {
        var grid = document.getElementById("allGrid");
        var bar = document.getElementById("folderBar");
        var html = '';

        if (gridScope === null) {
          bar.className = ''; bar.innerHTML = '';
          // Clients with 2+ products become a folder; everything else stays a normal card
          var counts = {}, members = {}, seen = {};
          folderKeys = [];
          videos.forEach(function(v, i) {
            var k = clientKey(v);
            if (!k) return;
            counts[k] = (counts[k] || 0) + 1;
            (members[k] = members[k] || []).push(i);
            if (!folderNames[k]) folderNames[k] = v.client.trim();
          });
          videos.forEach(function(v, i) {
            var k = clientKey(v);
            if (k && counts[k] >= 2) {
              if (seen[k]) return;
              seen[k] = true;
              folderKeys.push(k);
              html += folderCard(k, members[k], folderKeys.length - 1);
            } else {
              html += itemCard(v, i);
            }
          });
        } else {
          bar.className = 'on';
          bar.innerHTML = '<button class="folder-back" onclick="closeFolder()">&larr; All work</button>' +
            '<div class="folder-title">' + esc(folderNames[gridScope] || '') + '</div>';
          scopeList().forEach(function(i) { html += itemCard(videos[i], i); });
        }

        grid.innerHTML = html;
        grid.classList.remove("swap"); void grid.offsetWidth; grid.classList.add("swap");
        markActive();
      }

      function markActive() {
        var cards = document.querySelectorAll("#allGrid .vid-card");
        for (var k = 0; k < cards.length; k++) {
          var di = cards[k].getAttribute("data-i");
          cards[k].classList.toggle("active", di !== null && Number(di) === active);
        }
      }

      window.openFolder = function(n) {
        gridScope = folderKeys[n];
        renderGrid();
      };
      window.closeFolder = function() {
        gridScope = null;
        renderGrid();
      };

      function renderTriple() {
        if (videos.length === 0) return;
        if (!document.getElementById("tripleStage")) {
          document.getElementById("tripleView").innerHTML =
            '<div id="tripleStage"></div><div id="folderBar"></div><div class="all-grid" id="allGrid"></div>';
          var st = document.getElementById("tripleStage");
          // Pause auto-advance while a mouse is over the stage (not on touch screens)
          st.addEventListener("pointerenter", function(e) { if (e.pointerType === "mouse") hovering = true; });
          st.addEventListener("pointerleave", function(e) { if (e.pointerType === "mouse") hovering = false; });
          renderGrid();
        }
        renderStage();
        markActive();
        bindAuto();
      }

      window.setActive = function(i) {
        active = clamp(i);
        renderTriple();
      };

      window.openModal = function(i) {
        active = clamp(i);
        modalIndex = i;
        angleIdx = 0;
        renderTriple();
        showModal();
      };

      function showModal() {
        var modal = document.getElementById("videoModal");
        var vid = document.getElementById("modalVideo");
        var cap = document.getElementById("modalCaption");
        var cnt = document.getElementById("modalCounter");

        modal.classList.remove("hidden");
        var img = document.getElementById("modalImg");
        var sources = modalSources(videos[modalIndex]);
        if (angleIdx >= sources.length) angleIdx = 0;
        var msrc = sources[angleIdx];
        if (isVideoSrc(msrc)) {
          img.style.display = "none"; img.removeAttribute("src");
          vid.style.display = ""; vid.src = msrc;
        } else {
          vid.pause(); vid.removeAttribute("src"); vid.style.display = "none";
          img.src = msrc; img.style.display = "block";
        }
        cnt.textContent = "";

        var cur = videos[modalIndex];
        var ch = '';
        if (cur.title) ch += '<div class="title">' + esc(cur.title) + '</div>';
        if (cur.client) ch += '<div class="modal-client">Client &middot; ' + esc(cur.client) + '</div>';
        if (cur.details) ch += '<div class="modal-details">' + esc(cur.details).replace(/\n/g, '<br>') + '</div>';
        cap.innerHTML = ch;
        cap.style.display = ch ? '' : 'none';

        var th = document.getElementById("modalAngles");
        if (sources.length > 1) {
          var h = '';
          sources.forEach(function(sr, k) {
            h += '<button class="angle-sq' + (k === angleIdx ? ' on' : '') + '" onclick="setAngle(' + k + ')" aria-label="' + (k === 0 ? 'Main view' : 'Angle ' + k) + '">' +
              (isVideoSrc(sr) ? '<video src="' + sr + '" muted playsinline preload="metadata"></video>' : '<img src="' + sr + '" alt="" loading="lazy">') +
              '</button>';
          });
          th.innerHTML = h;
          th.style.display = 'flex';
        } else {
          th.innerHTML = '';
          th.style.display = 'none';
        }
      }

      window.setAngle = function(k) {
        angleIdx = k;
        showModal();
      };

      window.closeModal = function() {
        var modal = document.getElementById("videoModal");
        var vid = document.getElementById("modalVideo");
        modal.classList.add("hidden");
        vid.pause();
        vid.removeAttribute("src");
        document.getElementById("modalImg").removeAttribute("src");
        modalIndex = -1;
        angleIdx = 0;
      };

      window.modalNav = function(dir) {
        var list = scopeList();
        var pos = list.indexOf(modalIndex);
        if (pos < 0) { list = videos.map(function(x, i) { return i; }); pos = list.indexOf(modalIndex); }
        modalIndex = list[((pos + dir) % list.length + list.length) % list.length];
        angleIdx = 0;
        active = modalIndex;
        renderTriple();
        showModal();
      };

      document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") closeModal();
        if (e.key === "ArrowLeft") {
          if (modalIndex >= 0) { modalNav(-1); }
          else { setActive(active - 1); }
        }
        if (e.key === "ArrowRight") {
          if (modalIndex >= 0) { modalNav(1); }
          else { setActive(active + 1); }
        }
      });

      document.getElementById("videoModal").addEventListener("click", function(e) {
        if (e.target === this) closeModal();
      });

      renderTriple();
    }
    })();
  </script>
</body>
</html>
