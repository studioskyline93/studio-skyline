<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Work — Studio Skyline</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-layout { display: grid; gap: 24px; margin-top: 32px; }
    @media(min-width:1024px){ .admin-layout { grid-template-columns: 360px 1fr; } }

    .panel {
      border-radius: 16px; border: 1px solid rgba(228,228,231,0.6);
      background: rgba(255,255,255,0.7); backdrop-filter: blur(12px);
      padding: 20px;
    }

    .cat-item {
      display: flex; align-items: stretch; gap: 8px; border-radius: 12px;
      border: 1px solid rgba(228,228,231,0.6); margin-top: 8px; cursor: pointer;
    }
    .cat-item.active { border-color: var(--zinc-400); background: var(--zinc-50); }
    .cat-item:hover { background: var(--zinc-50); }
    .cat-item-info { flex: 1; padding: 8px 12px; }
    .cat-item-title { font-size: 14px; font-weight: 500; }
    .cat-item-slug { font-size: 12px; color: var(--zinc-500); font-family: monospace; }
    .cat-item-arrows { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-right: 8px; }
    .cat-item-arrows button {
      font-size: 12px; color: var(--zinc-500); background: none; border: none; cursor: pointer; padding: 2px;
    }
    .cat-item-arrows button:hover { color: var(--zinc-800); }

    .field-group { display: grid; gap: 12px; margin-top: 16px; }
    .field-group label { display: grid; gap: 4px; }
    .field-group label span { font-size: 12px; color: var(--zinc-500); }
    .field-group input, .field-group textarea {
      width: 100%; border-radius: 8px; border: 1px solid rgba(228,228,231,0.6);
      background: #fff; padding: 8px 12px; font-size: 14px; font-family: inherit;
      outline: none;
    }
    .field-group input:focus, .field-group textarea:focus { border-color: var(--zinc-400); }
    .field-group textarea { min-height: 80px; resize: vertical; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .vid-item {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      border-radius: 12px; border: 1px solid rgba(228,228,231,0.6); padding: 12px;
      margin-top: 8px;
    }
    .vid-item-info { min-width: 0; flex: 1; }
    .vid-item-name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vid-item-src { font-size: 12px; color: var(--zinc-500); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vid-item video { width: 80px; height: 48px; border-radius: 8px; border: 1px solid rgba(228,228,231,0.6); object-fit: cover; }
    .vid-item-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .vid-item-actions button { font-size: 13px; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 2px 0; }
    .vid-item-actions .danger { color: #dc2626; }
    .vid-item-actions .pin-btn.on { font-weight: 600; color: #800D1B; }
    .pin-count { font-size: 12px; font-weight: 400; color: var(--zinc-500); margin-left: 6px; }
    .vid-item-arrows { display: flex; flex-direction: column; gap: 4px; }
    .vid-item-arrows button { font-size: 12px; color: var(--zinc-500); background: none; border: none; cursor: pointer; }
    .vid-item-arrows button:hover { color: var(--zinc-800); }

    .status-bar {
      margin-top: 24px; border-radius: 12px; border: 1px solid rgba(228,228,231,0.6);
      background: rgba(255,255,255,0.7); padding: 16px; font-size: 14px; color: var(--zinc-700);
    }
    .status-bar:empty { display: none; }

    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .toolbar .spacer { flex: 1; }

    .angles-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 6px 0 0 12px; padding-left: 12px; border-left: 2px solid rgba(228,228,231,0.9);
    }
    .angles-label { font-size: 12px; color: var(--zinc-500); width: 44px; }
    .angle-thumb {
      position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(228,228,231,0.9); background: #f4f4f5;
    }
    .angle-thumb img, .angle-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .angle-x {
      position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; line-height: 16px;
      border: none; border-radius: 50%; background: rgba(0,0,0,0.65); color: #fff;
      font-size: 13px; cursor: pointer; padding: 0;
    }
    .angle-add {
      width: 56px; height: 56px; border-radius: 8px; border: 1px dashed var(--zinc-400);
      background: none; font-size: 11px; color: var(--zinc-600); cursor: pointer; line-height: 1.2;
    }
    .angle-add:hover { background: var(--zinc-50); }

    .meta-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
      margin: 6px 0 0 12px; padding-left: 12px; border-left: 2px solid rgba(228,228,231,0.9);
    }
    .meta-row label { display: grid; gap: 3px; }
    .meta-row label.wide { grid-column: 1 / -1; }
    .meta-row .item-folder { grid-column: 1 / -1; }
    .meta-row .item-folder:empty { display: none; }
    .meta-row span { font-size: 12px; color: var(--zinc-500); }
    .meta-row input, .meta-row textarea {
      width: 100%; border-radius: 8px; border: 1px solid rgba(228,228,231,0.6);
      background: #fff; padding: 7px 10px; font-size: 13px; font-family: inherit; outline: none;
    }
    .meta-row input:focus, .meta-row textarea:focus { border-color: var(--zinc-400); }
    .meta-row textarea { min-height: 64px; resize: vertical; }

    .file-item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border-radius: 12px; border: 1px solid rgba(228,228,231,0.6); padding: 12px;
      margin-top: 8px;
    }
    .file-item-name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item button { font-size: 13px; background: none; border: none; cursor: pointer; text-decoration: underline; }

    /* On/off switch + cover slideshow */
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider { position: absolute; inset: 0; background: #d4d4d8; border-radius: 20px; cursor: pointer; transition: background .2s; }
    .switch .slider:before { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
    .switch input:checked + .slider { background: #16a34a; }
    .switch input:checked + .slider:before { transform: translateX(14px); }
    .cat-item.is-off { opacity: 0.55; }
    .cat-item.is-off .cat-item-title { text-decoration: line-through; }
    .cat-off-tag { font-size: 11px; color: #dc2626; margin-left: 6px; }
    .cat-item-side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding-right: 8px; }
    .cat-cover { width: 56px; border-radius: 8px; overflow: hidden; background: #f4f4f5; flex-shrink: 0; margin: 6px 0 6px 6px; position: relative; align-self: stretch; min-height: 44px; }
    .cat-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .4s; }
    .cat-cover .cnt { position: absolute; bottom: 2px; right: 3px; font-size: 10px; background: rgba(0,0,0,.6); color: #fff; border-radius: 6px; padding: 0 4px; }
    .toggle-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 13px; color: var(--zinc-700); }

    /* no sideways scrolling */
    html, body { max-width: 100%; overflow-x: hidden; }
    .site-main, .panel, .admin-layout > * { min-width: 0; }
    .admin-layout { grid-template-columns: minmax(0,1fr); }
    @media(min-width:1024px){ .admin-layout { grid-template-columns: 340px minmax(0,1fr); } }
    .cat-item-slug, .cat-item-title { word-break: break-word; }
    .field-row, .meta-row { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    @media(max-width:520px){ .field-row, .meta-row { grid-template-columns: minmax(0,1fr); } .panel { padding: 14px; } }

    /* big sticky Save + Apply bar */
    #adminContent { padding-bottom: 120px; }
    .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; align-items: center; gap: 14px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom,0px)); background: #fff; border-top: 1px solid #e4e4e7; box-shadow: 0 -6px 24px rgba(0,0,0,.12); }
    .savebar #status { flex: 1; min-width: 0; font-size: 13px; color: var(--zinc-700); }
    .savebar #status:empty { display: none; }
    .savebar.dirty { background: #fffbeb; border-top: 2px solid #f59e0b; }
    .save-big { flex-shrink: 0; margin-left: auto; background: #800D1B; color: #fff; border: none; border-radius: 12px; padding: 16px 30px;
      font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(128,13,27,.35); }
    .save-big:disabled { opacity: .7; }
    .savebar.dirty .save-big { animation: pulse 1.4s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(128,13,27,.2); } }
    @media(max-width:560px){ .savebar { flex-direction: column-reverse; align-items: stretch; gap: 6px; } .save-big { width: 100%; margin-left: 0; } }

    /* droppable sections + items */
    details.sec { margin-top: 20px; border: 1px solid rgba(228,228,231,.8); border-radius: 12px; background: #fff; }
    details.sec > summary, details.item > summary { cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details.sec > summary { padding: 12px 14px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    details.sec > summary::before { content: "\25B8"; display: inline-block; transition: transform .15s; color: var(--zinc-500); }
    details.sec[open] > summary::before { transform: rotate(90deg); }
    .sec-body { padding: 0 14px 14px; }
    .sec-tools { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 4px; }
    .sec-tools button, .item-actions button { font-size: 13px; background: none; border: none; cursor: pointer; text-decoration: underline; padding: 2px 0; }
    details.item { margin-top: 8px; border: 1px solid rgba(228,228,231,.7); border-radius: 12px; background: #fff; }
    details.item[open] { border-color: var(--zinc-400); }
    details.item > summary { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
    .item-thumb { width: 56px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; border: 1px solid rgba(228,228,231,.9); background: #f4f4f5; }
    .item-sum-info { flex: 1; min-width: 0; }
    .pin-badge { font-size: 11px; font-weight: 600; color: #800D1B; border: 1px solid #800D1B; border-radius: 8px; padding: 1px 6px; flex-shrink: 0; }
    .item-body { padding: 0 10px 12px; }
    .item-actions { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 2px 0 10px; }
    .item-actions .danger { color: #dc2626; }
    .item-actions .pin-btn.on { font-weight: 600; color: #800D1B; }
    .item-body .meta-row, .item-body .angles-row { margin-left: 0; }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <div id="adminContent" style="display:none">

  <div class="site-main">
    <div class="toolbar">
      <div>
        <h1 style="font-size:24px; font-weight:600; letter-spacing:-0.02em">Work</h1>
        <p style="margin-top:4px; font-size:14px; color:var(--zinc-600)">Manage categories, photos and videos</p>
      </div>
      <div class="spacer"></div>
      <a href="admin.html" style="font-size:14px; text-decoration:underline">&larr; Back</a>
    </div>


    <div class="admin-layout">
      <!-- LEFT: Categories list -->
      <div class="panel">
        <details class="sec" id="catSec" open style="margin-top:0">
          <summary>Categories</summary>
          <div class="sec-body">
            <button class="btn-secondary" onclick="createCategory()">+ New category</button>
            <div id="catList"><div style="font-size:14px; color:var(--zinc-500)">Loading...</div></div>
          </div>
        </details>
      </div>

      <!-- RIGHT: Category editor -->
      <div class="panel" id="editorPanel">
        <div style="font-size:14px; color:var(--zinc-500)">Select a category.</div>
      </div>
    </div>
  </div>

  <div class="savebar" id="savebar"><div id="status"></div><button class="save-big" id="saveBtn" onclick="saveAll()">Save &amp; Apply changes</button></div>
  </div><!-- end adminContent -->
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="shared.js"></script>
  <script>
    var work = { collections: [] };
    var activeSlug = "";
    var availableFiles = [];

    // --- Load ---
    async function loadAll() {
      var data = await loadWorkContent();
      if (data && data.collections) {
        work = data;
      }
      if (work.collections.length > 0 && !activeSlug) {
        activeSlug = work.collections[0].slug;
      }
      renderCats();
      renderEditor();
    }

    // --- Save ---
    async function saveAll() {
      var btn = document.getElementById("saveBtn");
      if (document.getElementById("editSlug") && !applyEdits(true)) return;
      btn.textContent = "Saving..."; btn.disabled = true;
      var ok = await saveWorkContent(work);
      btn.textContent = "Save & Apply changes"; btn.disabled = false;
      setStatus(ok ? "Saved \u2713" : "Save failed - try again.");
      if (!ok) document.getElementById("savebar").classList.add("dirty");
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
      var bar = document.getElementById("savebar");
      if (/Click Save/i.test(msg)) bar.classList.add("dirty");
      else if (/^Saved/.test(msg)) bar.classList.remove("dirty");
    }


    // --- Show / hide a category ---
    function isOn(c) { return c.enabled !== false; }

    function toggleCat(slug, on) {
      for (var i = 0; i < work.collections.length; i++) {
        if (work.collections[i].slug === slug) {
          if (on) delete work.collections[i].enabled;   // default = visible
          else work.collections[i].enabled = false;
          setStatus('"' + work.collections[i].title + '" is now ' + (on ? 'visible' : 'hidden') + '. Click Save changes to persist.');
          break;
        }
      }
      renderCats();
      if (slug === activeSlug) renderEditor();
    }

    // --- Client folders: items sharing a client name; cover changes every 3s when the folder has more than 2 pictures ---
    var coverIdx = {};
    var VIDEO_RE = /\.(mp4|webm|mov|m4v)(\?|#|$)/i;

    function clientGroups(c) {
      var map = {}, order = [];
      (c.videos || []).forEach(function(v) {
        var k = (v.client || "").trim().toLowerCase();
        if (!k) return;
        if (!map[k]) { map[k] = { key: k, name: v.client.trim(), items: [] }; order.push(k); }
        map[k].items.push(v);
      });
      return order.map(function(k) { return map[k]; }).filter(function(g) { return g.items.length >= 2; });
    }
    function folderOn(c, key) { return (c.hiddenFolders || []).indexOf(key) < 0; }
    function toggleFolder(idx, on) {
      var c = getActive();
      if (!c) return;
      var g = clientGroups(c)[idx];
      if (!g) return;
      var list = (c.hiddenFolders || []).filter(function(k) { return k !== g.key; });
      if (!on) list.push(g.key);
      if (list.length) c.hiddenFolders = list; else delete c.hiddenFolders;
      renderClientFolders();
      setStatus('Folder "' + g.name + '" is now ' + (on ? 'shown as a folder' : 'turned off (items show individually)') + '. Click Save changes to persist.');
    }
    function toggleFolderByKey(key, on) {
      var c = getActive();
      if (!c) return;
      var g = clientGroups(c).filter(function(x) { return x.key === key; })[0];
      if (!g) return;
      var list = (c.hiddenFolders || []).filter(function(k) { return k !== key; });
      if (!on) list.push(key);
      if (list.length) c.hiddenFolders = list; else delete c.hiddenFolders;
      renderClientFolders();
      setStatus('Folder "' + g.name + '" is now ' + (on ? 'shown as a folder' : 'turned off (items show individually)') + '. Click Save changes to persist.');
    }
    // Folder on/off switch shown under the Client field of each item
    function renderItemFolderToggles() {
      var c = getActive();
      var slots = document.querySelectorAll(".item-folder");
      if (!c) return;
      var groups = clientGroups(c);
      Array.prototype.forEach.call(slots, function(slot) {
        var v = (c.videos || [])[+slot.getAttribute("data-idx")];
        var key = v ? (v.client || "").trim().toLowerCase() : "";
        var g = key ? groups.filter(function(x) { return x.key === key; })[0] : null;
        if (!g) { slot.innerHTML = ""; return; }
        var on = folderOn(c, key);
        slot.innerHTML = '<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 10px; border:1px solid rgba(228,228,231,0.6); border-radius:10px; background:#fafafa">' +
          '<span style="font-size:12px; color:var(--zinc-500)">Show &ldquo;' + escA(g.name) + '&rdquo; as a folder <b style="color:' + (on ? '#16a34a' : '#a1a1aa') + '; font-weight:500">' + (on ? 'ON' : 'OFF') + '</b></span>' +
          '<label class="switch" title="' + (on ? 'Folder on - click to turn off' : 'Folder off - click to turn on') + '"><input type="checkbox"' + (on ? ' checked' : '') +
          ' data-key="' + escA(key) + '" onchange="toggleFolderByKey(this.getAttribute(\'data-key\'), this.checked)"><span class="slider"></span></label></div>';
      });
    }
    function groupPics(g) {
      return g.items.map(function(v) { return v.src; }).filter(function(src) { return src && !VIDEO_RE.test(src); });
    }

    function renderClientFolders() {
      renderItemFolderToggles();
      var el = document.getElementById("clientFolders");
      var c = getActive();
      if (!el || !c) return;
      var groups = clientGroups(c);
      if (!groups.length) {
        el.innerHTML = '<div style="margin-top:8px; font-size:13px; color:var(--zinc-500)">No client folders yet. Give 2 or more items the same client name and they appear as one folder on the website.</div>';
        return;
      }
      var html = '<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:8px">';
      groups.forEach(function(g, gi) {
        var on = folderOn(c, g.key);
        var pics = groupPics(g);
        var cycle = pics.length > 2 && on;
        var first = pics.length ? pics[(coverIdx[g.key] || 0) % pics.length] : "";
        html += '<div style="border:1px solid rgba(228,228,231,0.6); border-radius:12px; overflow:hidden; background:#fff' + (on ? '' : '; opacity:.55') + '">' +
          '<div class="cf-cover" data-key="' + escA(g.key) + '" style="position:relative; aspect-ratio:4/3; background:#f4f4f5">' +
          (first ? '<img src="' + escA(first) + '" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .4s">' : '') +
          (cycle ? '<span style="position:absolute; bottom:4px; right:6px; font-size:10px; background:rgba(0,0,0,.6); color:#fff; border-radius:6px; padding:0 5px">auto &middot; ' + pics.length + '</span>' : '') +
          '</div>' +
          '<div style="padding:8px 10px; display:flex; align-items:center; justify-content:space-between; gap:8px">' +
          '<div style="min-width:0"><div style="font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap' + (on ? '' : '; text-decoration:line-through') + '">' + escA(g.name) + '</div>' +
          '<div style="font-size:12px; color:var(--zinc-500)">' + g.items.length + ' pieces' + (on ? '' : ' &middot; off') + '</div></div>' +
          '<label class="switch" title="' + (on ? 'Folder on — click to turn off' : 'Folder off — click to turn on') + '"><input type="checkbox"' + (on ? ' checked' : '') +
          ' onchange="toggleFolder(' + gi + ', this.checked)"><span class="slider"></span></label></div></div>';
      });
      el.innerHTML = html + '</div>';
    }

    setInterval(function() {
      var c = getActive();
      if (!c) return;
      clientGroups(c).forEach(function(g) {
        var pics = groupPics(g);
        if (pics.length <= 2 || !folderOn(c, g.key)) return;
        coverIdx[g.key] = ((coverIdx[g.key] || 0) + 1) % pics.length;
        var box = document.querySelector('.cf-cover[data-key="' + g.key.replace(/"/g, '\\"') + '"]');
        if (!box) return;
        var img = box.querySelector("img");
        if (!img) return;
        img.style.opacity = 0;
        setTimeout(function() { img.src = pics[coverIdx[g.key]]; img.style.opacity = 1; }, 400);
      });
    }, 3000);

    function getActive() {
      for (var i = 0; i < work.collections.length; i++) {
        if (work.collections[i].slug === activeSlug) return work.collections[i];
      }
      return null;
    }

    // --- Render categories sidebar ---
    function renderCats() {
      var el = document.getElementById("catList");
      if (work.collections.length === 0) {
        el.innerHTML = '<div style="font-size:14px; color:var(--zinc-500); margin-top:12px">No categories yet.</div>';
        return;
      }
      var html = "";
      work.collections.forEach(function(c, idx) {
        var on = isOn(c);
        html += '<div class="cat-item' + (c.slug === activeSlug ? ' active' : '') + (on ? '' : ' is-off') + '" onclick="selectCat(\'' + c.slug + '\')">' +
          '<div class="cat-item-info"><div class="cat-item-title">' + c.title + (on ? '' : '<span class="cat-off-tag">Hidden</span>') + '</div>' +
          '<div class="cat-item-slug">/' + c.slug + '</div></div>' +
          '<div class="cat-item-side">' +
          '<label class="switch" title="' + (on ? 'Visible — click to hide' : 'Hidden — click to show') + '" onclick="event.stopPropagation()">' +
          '<input type="checkbox"' + (on ? ' checked' : '') + ' onchange="toggleCat(\'' + c.slug + '\', this.checked)"><span class="slider"></span></label>' +
          '<div style="display:flex; gap:2px">' +
          '<button style="font-size:12px;color:var(--zinc-500);background:none;border:none;cursor:pointer;padding:2px" onclick="event.stopPropagation(); moveCat(' + idx + ',-1)" title="Move up">&uarr;</button>' +
          '<button style="font-size:12px;color:var(--zinc-500);background:none;border:none;cursor:pointer;padding:2px" onclick="event.stopPropagation(); moveCat(' + idx + ',1)" title="Move down">&darr;</button>' +
          '</div></div></div>';
      });
      el.innerHTML = html;
    }

    function selectCat(slug) {
      activeSlug = slug;
      renderCats();
      renderEditor();
      if (window.innerWidth < 1024) {
        var cs = document.getElementById("catSec"); if (cs) cs.open = false;
        document.getElementById("editorPanel").scrollIntoView();
      }
    }

    function moveCat(idx, dir) {
      var target = idx + dir;
      if (target < 0 || target >= work.collections.length) return;
      var tmp = work.collections[idx];
      work.collections[idx] = work.collections[target];
      work.collections[target] = tmp;
      renderCats();
    }

    function createCategory() {
      var slug = prompt("New category slug (lowercase, numbers, hyphens):");
      if (!slug) return;
      slug = slug.trim().toLowerCase();
      if (!/^[a-z0-9-]+$/.test(slug)) { setStatus("Invalid slug."); return; }
      if (work.collections.some(function(c) { return c.slug === slug; })) { setStatus("Slug already exists."); return; }

      var title = prompt("Title for this category?", "");
      if (!title) { setStatus("Title is required."); return; }

      work.collections.push({ slug: slug, index: "", title: title.trim(), subtitle: "", description: "", videos: [] });
      activeSlug = slug;
      renderCats();
      renderEditor();
      setStatus("Category created. Add videos, then Save.");
    }

    function deleteCategory() {
      var c = getActive();
      if (!c) return;
      if (!confirm('Delete category "' + c.title + '"?')) return;
      work.collections = work.collections.filter(function(x) { return x.slug !== c.slug; });
      activeSlug = work.collections.length > 0 ? work.collections[0].slug : "";
      renderCats();
      renderEditor();
      setStatus("Category removed. Click Save to persist.");
    }

    // --- Render editor ---
    var openItems = {}, scrollToSrc = "";
    var secState = { details: false, folders: false, items: true,  };
    function onSec(k, el) { secState[k] = el.open; }
    function onItem(el) { openItems[el.getAttribute("data-src")] = el.open; }
    function setAllItems(open) {
      var c = getActive(); if (!c) return;
      (c.videos || []).forEach(function(v) { openItems[v.src] = open; });
      renderEditor();
    }
    function jumpNewest() {
      var c = getActive(); if (!c || !c.videos.length) return;
      var v = c.videos[c.videos.length - 1];
      openItems[v.src] = true; secState.items = true; scrollToSrc = v.src;
      renderEditor();
    }
    function sec(key, id, title, body) {
      return '<details class="sec" id="' + id + '"' + (secState[key] ? ' open' : '') + ' ontoggle="onSec(\'' + key + '\',this)"><summary>' + title + '</summary><div class="sec-body">' + body + '</div></details>';
    }

    function renderEditor() {
      var panel = document.getElementById("editorPanel");
      var c = getActive();
      var sy = window.scrollY;
      if (!c) {
        panel.innerHTML = '<div style="font-size:14px; color:var(--zinc-500)">Select a category.</div>';
        return;
      }
      var vids = c.videos || [];
      var nPinned = vids.filter(function(v) { return v.pinned === true; }).length;

      var html = '<div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px">' +
        '<div style="font-size:16px; font-weight:600">' + c.title + '</div>' +
        '<div><input type="file" accept="video/mp4,image/*" multiple id="uploadInput" style="display:none" onchange="uploadFiles(this.files)">' +
        '<button class="btn-secondary" onclick="document.getElementById(\'uploadInput\').click()">+ Upload photos / videos</button></div></div>';

      html += '<div class="toggle-row"><label class="switch"><input type="checkbox"' + (isOn(c) ? ' checked' : '') +
        ' onchange="toggleCat(\'' + c.slug + '\', this.checked)"><span class="slider"></span></label>' +
        '<span>' + (isOn(c) ? 'Visible on the website' : 'Hidden from the website') + '</span></div>';

      // Category details (dropdown)
      html += sec('details', 'secDetails', 'Category details',
        '<div style="text-align:right"><button onclick="deleteCategory()" style="font-size:13px; color:#dc2626; background:none; border:none; cursor:pointer; text-decoration:underline">Delete category</button></div>' +
        '<div class="field-group" style="margin-top:4px">' +
        '<div class="field-row">' +
        '<label><span>Index</span><input id="editIndex" value="' + (c.index || '') + '" placeholder="01"></label>' +
        '<label><span>Slug</span><input id="editSlug" value="' + c.slug + '" placeholder="paper-bags" style="font-family:monospace"></label>' +
        '</div>' +
        '<label><span>Title</span><input id="editTitle" value="' + c.title + '" placeholder="Paper Bags"></label>' +
        '<label><span>Subtitle</span><input id="editSubtitle" value="' + (c.subtitle || '') + '" placeholder="Luxury paper bags"></label>' +
        '<label><span>Description</span><textarea id="editDesc" placeholder="Short description...">' + (c.description || '') + '</textarea></label>' +
        '</div>');

      // Client folders (dropdown)
      html += sec('folders', 'secFolders', 'Client folders',
        '<div style="font-size:12px; color:var(--zinc-500)">Cover photos change every 3 seconds when a folder has more than 2 pictures. Turn a folder off to show its items individually instead.</div><div id="clientFolders"></div>');

      // Items: each one is its own dropdown
      var items = '';
      if (vids.length === 0) {
        items = '<div style="font-size:14px; color:var(--zinc-500)">No videos in this category yet.</div>';
      } else {
        items = '<div class="sec-tools"><button onclick="jumpNewest()">&darr; Jump to newest</button><button onclick="setAllItems(true)">Expand all</button><button onclick="setAllItems(false)">Collapse all</button></div>';
        vids.forEach(function(v, idx) {
          var fname = v.src.split("/").pop();
          var name = v.title || fname;
          var thumb = VIDEO_RE.test(v.src)
            ? '<video class="item-thumb" src="' + escA(v.src) + '" muted playsinline preload="metadata"></video>'
            : '<img class="item-thumb" src="' + escA(v.src) + '" alt="" loading="lazy">';
          items += '<details class="item" data-src="' + escA(v.src) + '"' + (openItems[v.src] ? ' open' : '') + ' ontoggle="onItem(this)"><summary>' + thumb +
            '<div class="item-sum-info"><div class="vid-item-name" id="nm' + idx + '">' + escA(name) + '</div><div class="vid-item-src">#' + (idx + 1) + ' &middot; ' + escA(fname) + '</div></div>' +
            '<span class="pin-badge" id="pb' + idx + '"' + (v.pinned === true ? '' : ' style="display:none"') + '>Pinned</span></summary><div class="item-body">' +
            '<div class="item-actions">' +
            '<button onclick="moveVid(' + idx + ',-1)">&uarr; Up</button><button onclick="moveVid(' + idx + ',1)">&darr; Down</button>' +
            '<button class="pin-btn' + (v.pinned === true ? ' on' : '') + '" onclick="togglePin(' + idx + ', this)" title="Pinned items show first on the website">' + (v.pinned === true ? 'Pinned \u2713' : 'Pin to top') + '</button>' +
            '<button onclick="removeVid(' + idx + ')">Remove</button>' +
            '<button class="danger" onclick="deleteVidForever(' + idx + ')">Delete forever</button></div>';

          items += '<div class="meta-row">' +
            '<label><span>Product name</span><input value="' + escA(v.title) + '" placeholder="e.g. Magnetic gift box" oninput="setMeta(' + idx + ',\'title\',this.value)"></label>' +
            '<label><span>Client</span><input list="clientList" value="' + escA(v.client) + '" placeholder="e.g. Crowne Plaza" oninput="setMeta(' + idx + ',\'client\',this.value)"></label>' +
            '<div class="item-folder" data-idx="' + idx + '"></div>' +
            '<label class="wide"><span>Details (shown when visitors open this item)</span>' +
            '<textarea placeholder="Size, material, finish, quantity, turnaround..." oninput="setMeta(' + idx + ',\'details\',this.value)">' + escA(v.details) + '</textarea></label></div>';

          items += '<div class="angles-row"><span class="angles-label">Angles</span>';
          (v.angles || []).forEach(function(a, j) {
            var src = (typeof a === "string") ? a : a.src;
            var media = VIDEO_RE.test(src) ? '<video src="' + src + '" muted playsinline></video>' : '<img src="' + src + '" alt="">';
            items += '<div class="angle-thumb">' + media + '<button class="angle-x" onclick="removeAngle(' + idx + ',' + j + ')" title="Remove angle">&times;</button></div>';
          });
          items += '<input type="file" accept="image/*,video/mp4" multiple id="angleInput' + idx + '" style="display:none" onchange="uploadAngles(' + idx + ', this.files)">' +
            '<button class="angle-add" onclick="document.getElementById(\'angleInput' + idx + '\').click()">+ Add angles</button></div></div></details>';
        });
      }
      html += sec('items', 'secItems', 'Current items (' + vids.length + ')<span class="pin-count" id="pinCount">' + (nPinned ? nPinned + ' pinned to top' : '') + '</span>', items);

      var seenClients = {}, opts = '';
      vids.forEach(function(v) {
        var n = (v.client || "").trim();
        if (n && !seenClients[n.toLowerCase()]) { seenClients[n.toLowerCase()] = true; opts += '<option value="' + escA(n) + '">'; }
      });
      html += '<datalist id="clientList">' + opts + '</datalist>';

      panel.innerHTML = html;
      window.scrollTo(0, sy);
      renderClientFolders();
      if (scrollToSrc) {
        var all = document.querySelectorAll("details.item");
        for (var i = 0; i < all.length; i++) {
          if (all[i].getAttribute("data-src") === scrollToSrc) { all[i].scrollIntoView({ block: "center" }); break; }
        }
        scrollToSrc = "";
      }
    }

    function applyEdits(silent) {
      var c = getActive();
      if (!c) return;
      var newSlug = document.getElementById("editSlug").value.trim().toLowerCase();
      var ds = document.getElementById("secDetails");
      if (!newSlug || !/^[a-z0-9-]+$/.test(newSlug)) { if (ds) ds.open = true; setStatus("Invalid slug."); return false; }
      var newTitle = document.getElementById("editTitle").value.trim();
      if (!newTitle) { if (ds) ds.open = true; setStatus("Title cannot be empty."); return false; }

      if (newSlug !== c.slug && work.collections.some(function(x) { return x.slug === newSlug; })) {
        if (ds) ds.open = true; setStatus("Slug already exists."); return false;
      }

      c.index = document.getElementById("editIndex").value.trim();
      c.title = newTitle;
      c.subtitle = document.getElementById("editSubtitle").value.trim();
      c.description = document.getElementById("editDesc").value.trim();
      c.slug = newSlug;
      activeSlug = newSlug;

      renderCats();
      renderEditor();
      if (!silent) setStatus("Updated. Click Save to persist.");
      return true;
    }

    // --- Item details (product name / client / details) ---
    function escA(x) {
      return String(x == null ? "" : x).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function setMeta(idx, field, val) {
      var c = getActive();
      if (!c || !c.videos[idx]) return;
      if (val.trim() === "") delete c.videos[idx][field];
      else c.videos[idx][field] = val;
      if (field === "client") renderClientFolders();
      if (field === "title") { var nm = document.getElementById("nm" + idx); if (nm) nm.textContent = c.videos[idx].title || c.videos[idx].src.split("/").pop(); }
      setStatus("Details edited. Click Save changes to persist.");
    }

    // --- Videos ---
    function moveVid(idx, dir) {
      var c = getActive();
      if (!c) return;
      var target = idx + dir;
      if (target < 0 || target >= c.videos.length) return;
      var tmp = c.videos[idx];
      c.videos[idx] = c.videos[target];
      c.videos[target] = tmp;
      renderEditor();
    }

    // Pin to top: pinned items show first on the website (nothing marks them as pinned); everything else stays newest-first below
    function togglePin(idx, btn) {
      var c = getActive();
      if (!c || !c.videos[idx]) return;
      var v = c.videos[idx];
      if (v.pinned === true) delete v.pinned; else v.pinned = true;
      var on = v.pinned === true;
      var pb = document.getElementById("pb" + idx); if (pb) pb.style.display = on ? "" : "none";
      if (btn) { btn.classList.toggle("on", on); btn.textContent = on ? "Pinned \u2713" : "Pin to top"; }
      var n = c.videos.filter(function(x) { return x.pinned === true; }).length;
      var pc = document.getElementById("pinCount");
      if (pc) pc.textContent = n ? n + " pinned to top" : "";
      setStatus(on ? "Pinned. Click Save changes to persist." : "Unpinned. Click Save changes to persist.");
    }

    function removeVid(idx) {
      var c = getActive();
      if (!c) return;
      c.videos.splice(idx, 1);
      renderEditor();
      setStatus("Video removed. Click Save to persist.");
    }

    async function deleteVidForever(idx) {
      var c = getActive();
      if (!c) return;
      var v = c.videos[idx];
      if (!confirm("Permanently delete this file from storage?\n" + v.src)) return;

      // Extract storage path from public URL
      var path = "";
      if (SUPABASE_URL && v.src.indexOf(SUPABASE_URL) === 0) {
        path = v.src.replace(SUPABASE_URL + "/storage/v1/object/public/" + SUPABASE_BUCKET + "/", "");
      }

      if (path) {
        var ok = await deleteFromStorage(path);
        if (!ok) { setStatus("Delete from storage failed."); return; }
      }

      c.videos.splice(idx, 1);
      renderEditor();
      setStatus("Deleted forever. Click Save to persist.");
    }

    // --- Angles (extra pictures per item) ---
    async function uploadAngles(idx, files) {
      if (!files || files.length === 0) return;
      var c = getActive();
      if (!c) return;
      var v = c.videos[idx];
      if (!v.angles) v.angles = [];

      setStatus("Uploading angles...");
      for (var i = 0; i < files.length; i++) {
        var result = await uploadToStorage(c.slug, files[i]);
        if (result) {
          v.angles.push(result.src);
        } else {
          renderEditor();
          setStatus("Upload failed for " + files[i].name);
          return;
        }
      }
      renderEditor();
      setStatus("Angles added. Click Save changes to persist.");
    }

    function removeAngle(idx, j) {
      var c = getActive();
      if (!c) return;
      c.videos[idx].angles.splice(j, 1);
      renderEditor();
      setStatus("Angle removed. Click Save changes to persist.");
    }

    async function uploadFiles(files) {
      if (!files || files.length === 0) return;
      var c = getActive();
      if (!c) return;

      setStatus("Uploading...");
      for (var i = 0; i < files.length; i++) {
        var result = await uploadToStorage(c.slug, files[i]);
        if (result) {
          c.videos.push({ src: result.src });
          openItems[result.src] = true; scrollToSrc = result.src; secState.items = true;
        } else {
          setStatus("Upload failed for " + files[i].name);
          return;
        }
      }
      renderEditor();
      setStatus("Upload complete. Click Save to persist.");
    }

    // --- Available files in storage ---
    async function loadFiles() {
      var c = getActive();
      if (!c) return;
      var el = document.getElementById("fileList");
      if (!el) return;

      var files = await listStorageFiles(c.slug + "/videos");
      files = files || [];
      availableFiles = files;

      // Files already used, either as an item or as one of its angles
      var existingSrcs = {};
      (c.videos || []).forEach(function(v) {
        existingSrcs[v.src] = true;
        (v.angles || []).forEach(function(a) { existingSrcs[(typeof a === "string") ? a : a.src] = true; });
      });

      var addable = files.filter(function(f) {
        var url = storagePublicUrl(c.slug, f);
        return !existingSrcs[url];
      });

      if (files.length === 0) {
        el.innerHTML = '<div style="margin-top:8px; font-size:14px; color:var(--zinc-500)">No files found.</div>';
      } else if (addable.length === 0) {
        el.innerHTML = '<div style="margin-top:8px; font-size:14px; color:var(--zinc-500)">All uploaded files are already added.</div>';
      } else {
        var html = "";
        addable.forEach(function(f) {
          html += '<div class="file-item"><div class="file-item-name">' + f + '</div>' +
            '<button onclick="addFileToCollection(\'' + f.replace(/'/g, "\\'") + '\')">Add</button></div>';
        });
        el.innerHTML = html;
      }
    }

    function addFileToCollection(filename) {
      var c = getActive();
      if (!c) return;
      var src = storagePublicUrl(c.slug, filename);
      if (!src) { setStatus("Could not build URL."); return; }
      if (c.videos.some(function(v) { return v.src === src; })) return;
      c.videos.push({ src: src });
      openItems[src] = true; scrollToSrc = src; secState.items = true;
      renderEditor();
    }

    // --- Init ---
    function onAdminReady() { loadAll(); }
  </script>
  <script src="admin-auth.js"></script>
  <script>initAdminAuth();</script>
</body>
</html>
